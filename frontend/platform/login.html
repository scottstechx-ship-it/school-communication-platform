<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — School Portal</title>
<script>try{var t=localStorage.getItem('scp_theme');if(t==='dark'||((!t||t==='system')&&window.matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
<link rel="stylesheet" href="css/app.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 55%, #3b82f6 100%); padding: 16px; }
  .login-card { background: #fff; border-radius: 16px; box-shadow: 0 25px 60px rgba(2,6,23,.35); width: 100%; max-width: 420px; padding: 32px; }
  .login-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .login-brand .logo { width: 46px; height: 46px; border-radius: 12px; background: #2563eb; display: grid; place-items: center; font-size: 22px; }
  .login-card h1 { font-size: 20px; margin-bottom: 2px; }
  .login-sub { color: #64748b; font-size: 13px; margin-bottom: 22px; }
  .demo-box { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 10px; padding: 12px; margin-top: 18px; }
  .demo-box .d-title { font-weight: 700; font-size: 12.5px; color: #15803d; margin-bottom: 8px; }
  .demo-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
  .demo-row .btn { font-size: 11.5px; padding: 5px 9px; }
  .err { background: #fee2e2; color: #b91c1c; border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; display: none; }
  .foot { margin-top: 18px; text-align: center; color: #94a3b8; font-size: 12px; }
</style>
</head>
<body>
  <div class="login-card">
    <div class="login-brand">
      <div class="logo" id="brand-logo">🎓</div>
      <div>
        <h1 id="school-title">School Portal</h1>
        <div class="login-sub" id="school-sub">Secure sign in to your school dashboard</div>
      </div>
    </div>
    <div class="err" id="login-err"></div>
    <div id="role-hint" style="display:none;margin:0 0 14px;padding:10px 12px;border-radius:10px;background:#eff6ff;color:#1d4ed8;font-size:13px;font-weight:600"></div>
    <form id="login-form">
      <label class="field">Username or email
        <input id="username" name="username" autocomplete="username" placeholder="e.g. teacher1" required>
      </label>
      <label class="field">Password
        <input id="password" type="password" name="password" autocomplete="current-password" placeholder="••••••••" required>
      </label>
      <button class="btn block" type="submit" id="login-btn" style="padding:12px;font-size:15px">Sign in</button>
      <div style="text-align:center;margin-top:12px;display:flex;gap:14px;justify-content:center;font-size:13px">
        <a href="forgot-password.html">Forgot password?</a>
        <a href="register.html"><strong>Parent? Register here</strong></a>
      </div>
    </form>

    <div class="demo-box">
      <div class="d-title">🧪 DEMO ACCOUNTS — click to fill</div>
      <div class="demo-row">
        <button class="btn secondary sm" data-demo="superadmin|SuperAdmin@123">🛡 Super Admin</button>
        <button class="btn secondary sm" data-demo="admin|Admin@123">🏫 Admin</button>
      </div>
      <div class="demo-row">
        <button class="btn secondary sm" data-demo="teacher1|Teacher@123">👩‍🏫 Teacher</button>
        <button class="btn secondary sm" data-demo="student1|Student@123">🧑‍🎓 Student</button>
        <button class="btn secondary sm" data-demo="parent1|Parent@123">👨‍👧 Parent</button>
      </div>
    </div>
    <div class="foot">School Communication Platform — messaging, documents & announcements.<br>Demo build — do not store real personal data.</div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
<script src="js/theme.js"></script>
  <script src="js/ui.js"></script>
  <script>
    (function () {
      const ROLE_HOME = { super_admin: 'super-admin', admin: 'admin', teacher: 'teacher', student: 'student', parent: 'parent' };
      const requestedRole = new URLSearchParams(location.search).get('role');
      const roleLabels = {super_admin:'Super Admin',admin:'Admin',teacher:'Teacher',student:'Student',parent:'Parent/Guardian'};
      if(requestedRole && roleLabels[requestedRole]) { const hint=document.getElementById('role-hint'); hint.textContent='Signing in as '+roleLabels[requestedRole]; hint.style.display='block'; }

      document.querySelectorAll('[data-demo]').forEach(function (b) {
        b.addEventListener('click', function () {
          const [u, p] = b.dataset.demo.split('|');
          document.getElementById('username').value = u;
          document.getElementById('password').value = p;
        });
      });

      // school name from the API when reachable
      fetch(API.base + '/api/settings/public').then(r => r.json()).then(s => {
        if (s.school && s.school.name) {
          document.getElementById('school-title').textContent = s.school.name;
        }
      }).catch(() => {});

      // school logo (public endpoint; fall back to the 🎓 mark)
      (function () {
        const box = document.getElementById('brand-logo');
        if (!box) return;
        const img = new Image();
        img.onload = function () {
          box.textContent = '';
          box.classList.add('has-logo');
          box.appendChild(img);
        };
        img.onerror = function () { box.textContent = '🎓'; };
        img.src = API.base + '/api/settings/logo?t=' + Date.now();
        img.alt = 'School logo';
        img.style.cssText = 'width:100%;height:100%;object-fit:contain;display:block';
      })();

      document.getElementById('login-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        const errBox = document.getElementById('login-err');
        errBox.style.display = 'none';
        const btn = document.getElementById('login-btn');
        btn.disabled = true; btn.textContent = 'Signing in…';
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        try {
          const data = await API.post('/api/auth/login', { username, password });
          API.setToken(data.token);
          API.setUser(data.user);
          window.UI.toast('Welcome, ' + data.user.fullName + '!', 'success');
          if (data.user.mustChangePassword) {
            location.href = 'set-password.html';
            return;
          }
          if (requestedRole && requestedRole !== data.user.role) { throw new Error('This account is '+(roleLabels[data.user.role] || data.user.role)+', not '+(roleLabels[requestedRole] || requestedRole)+'. Use the correct portal.'); }
          const home = ROLE_HOME[data.user.role] || 'student';
          location.href = home + '/index.html';
        } catch (err) {
          errBox.textContent = err.message || 'Incorrect email or password.';
          errBox.style.display = 'block';
          btn.disabled = false; btn.textContent = 'Sign in';
        }
      });
    })();
  </script>
</body>
</html>
